# Zero-shot prompt template for UnivEARTH benchmark.
# Variables: {question}

[template]
name = "zero_shot"
description = "Single-turn prompt without examples. Asks the agent to write GEE code, run it, and answer Yes/No."

# Optional system prompt. For Type 1 (internal agent), the extension already
# applies its own system prompt; this string is used only for Type 2 if the
# external agent supports a separate system message.
system = """You are an Earth observation analyst with access to Google Earth Engine (GEE).
Your task is to answer Yes/No questions about Earth observation phenomena by writing and
running GEE JavaScript code, then interpreting the results. You must ground your answer
in real GEE data, not prior knowledge alone."""

# The user-facing prompt body. {question} will be substituted.
user = """Question: {question}

Use Google Earth Engine to find evidence supporting your answer:
1. Identify the relevant satellite product / dataset (use geeDocs to search if needed)
2. Write GEE JavaScript code that loads the data, filters by location and time, and prints
   a quantitative result to the console
3. Run the code and read the console output
4. Based on the evidence, decide Yes or No

IMPORTANT FORMAT REQUIREMENT:
Your final line MUST be exactly one of:
ANSWER: Yes
ANSWER: No

If the data is unavailable or your code cannot run successfully, still emit one of the two
ANSWER lines based on your best judgment from partial evidence."""
